name: COT weekly

on:
  schedule:
    # 毎日 21:47 / 22:47 UTC = 毎日 6:47 / 7:47 JST（念のため2回）
    # CFTC公表は通常 金曜15:30 米東部時間（土曜 4:30〜5:30 JST）。祝日週は月曜などにずれるため毎日確認する
    - cron: "47 21 * * *"
    - cron: "47 22 * * *"
  workflow_dispatch:

# 既定は読み取りのみ。書き込み権限は必要なジョブにだけ与える
permissions:
  contents: read

concurrency:
  group: cot-weekly
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # data/cot の更新を push するため
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Test
        run: python -m pytest -q

      - name: Fetch and build
        run: python -m cot.run

      # Google Search Console の所有権確認ファイル（削除すると確認が外れる）
      - name: Copy site verification file
        run: cp cot/google*.html site/cot/

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cot
          if git diff --cached --quiet; then
            echo "データ変更なし"
          else
            git commit -m "COTデータ更新 $(date -u +%Y-%m-%d)" -m "CFTCの週次公表分と過去週の訂正を履歴に反映するため"
            git push
          fi

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write      # Pages へのデプロイ
      id-token: write   # Pages デプロイの認証
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
