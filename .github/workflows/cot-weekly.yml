name: COT weekly

on:
  schedule:
    # 毎日 21:47 / 22:47 UTC = 毎日 6:47 / 7:47 JST（念のため2回）
    # CFTC公表は通常 金曜15:30 米東部時間（土曜 4:30〜5:30 JST）。祝日週は月曜などにずれるため毎日確認する
    - cron: "47 21 * * *"
    - cron: "47 22 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: cot-weekly
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Test
        run: python -m pytest -q

      - name: Fetch and build
        run: python -m cot.run

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cot
          if git diff --cached --quiet; then
            echo "データ変更なし"
          else
            git commit -m "COTデータ更新 $(date -u +%Y-%m-%d)" -m "CFTCの週次公表分と過去週の訂正を履歴に反映するため"
            git push
          fi

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
